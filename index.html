<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TM Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#172033;
font-family:Arial,sans-serif}
header{background:#172554;color:white;padding:22px}
header h1{margin:0 0 8px}
header p{margin:0;color:#dbeafe}
main{padding:16px;max-width:750px;margin:auto}
input{width:100%;padding:13px;border:1px solid #ddd;
border-radius:12px;margin-bottom:14px;font-size:16px}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button{cursor:pointer;border:0;border-radius:10px;padding:11px}
.cat{background:white;color:#172033}
.cat.active,.buy{background:#2563eb;color:white}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product{background:white;border-radius:14px;padding:12px}
.photo{font-size:50px;text-align:center;background:#eff6ff;
padding:20px;border-radius:10px}
.product h3{font-size:16px;margin:10px 0}
.price{font-weight:bold;margin:8px 0;color:#1d4ed8}
.buy{width:100%}
.cart{background:white;padding:16px;border-radius:14px;margin-top:18px}
#items p{display:flex;justify-content:space-between;gap:8px}
.checkout{width:100%;background:#16a34a;color:white;margin-top:10px}
small{color:#64748b}
</style>
</head>
<body>
<header>
  <h1>🛍️ TM Store</h1>
  <p>Discover products you love.</p>
</header>
<main>
  <input id="search" placeholder="Search products..." />
  <div class="categories" id="categories"></div>
  <div class="products" id="products"></div>
  <section class="cart">
    <h2>🛒 Your Cart (<span id="count">0</span>)</h2>
    <div id="items">Your cart is empty.</div>
    <h3>Total: $<span id="total">0.00</span></h3>
    <button class="checkout" onclick="checkout()">
      Send Order to Telegram
    </button>
    <small>This demo does not process payments.</small>
  </section>
</main>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const productsData = [
 {id:1,name:"Wireless Earbuds",price:15,cat:"Electronics",emoji:"🎧"},
 {id:2,name:"Smart Watch",price:25,cat:"Electronics",emoji:"⌚"},
 {id:3,name:"Casual T-Shirt",price:8,cat:"Fashion",emoji:"👕"},
 {id:4,name:"Travel Backpack",price:18,cat:"Fashion",emoji:"🎒"},
 {id:5,name:"Water Bottle",price:5,cat:"Lifestyle",emoji:"🥤"},
 {id:6,name:"Desk Lamp",price:12,cat:"Lifestyle",emoji:"💡"}
];
let category="All", cart={};

const categories=["All",...new Set(productsData.map(p=>p.cat))];
document.getElementById("categories").innerHTML=categories.map(c=>
 `<button class="cat ${c==="All"?"active":""}"
 onclick="setCategory('${c}',this)">${c}</button>`
).join("");

function setCategory(c,btn){
 category=c;
 document.querySelectorAll(".cat").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 render();
}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=productsData.filter(p=>
 (category==="All"||p.cat===category)&&p.name.toLowerCase().includes(q));
 document.getElementById("products").innerHTML=list.map(p=>
 `<article class="product">
 <div class="photo">${p.emoji}</div>
 <h3>${p.name}</h3><div class="price">$${p.price.toFixed(2)}</div>
 <button class="buy" onclick="add(${p.id})">Add to Cart</button>
 </article>`).join("")||"No products found.";
 updateCart();
}
function add(id){cart[id]=(cart[id]||0)+1;updateCart();}
function updateCart(){
 let count=0,total=0,lines=[];
 productsData.forEach(p=>{
  let n=cart[p.id]||0;
  if(n){count+=n;total+=n*p.price;
  lines.push(`<p>${p.name} × ${n}
  <button onclick="removeItem(${p.id})">−</button>
  <b>$${(n*p.price).toFixed(2)}</b></p>`);}
 });
 document.getElementById("count").textContent=count;
 document.getElementById("total").textContent=total.toFixed(2);
 document.getElementById("items").innerHTML=lines.join("")||"Your cart is empty.";
}
function removeItem(id){
 cart[id]=(cart[id]||0)-1;
 if(cart[id]<=0)delete cart[id];
 updateCart();
}
function checkout(){
 let lines=productsData.filter(p=>cart[p.id]).map(p=>
 `${p.name} x ${cart[p.id]} = $${(p.price*cart[p.id]).toFixed(2)}`);
 if(!lines.length){alert("Your cart is empty.");return;}
 const message="TM Store order:\n"+lines.join("\n")+
 "\nTotal: $"+document.getElementById("total").textContent;
 if(tg?.initData){
  tg.sendData(message);
 }else{
  alert(message+"\n\nDemo order only. No order has been submitted.");
 }
}
document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
